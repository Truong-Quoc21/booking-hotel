<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayNest - Home</title>
    <link rel="stylesheet" href="../../css/components/header.css">

    <link rel="stylesheet" href="../../css/pages/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="hero">
        <div class="hero-track" id="heroTrack">
            <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=1400&q=80')"></div>
            <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1582719508461-905c673771fd?w=1400&q=80')"></div>
            <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=1400&q=80')"></div>
            <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1400&q=80')"></div>
            <div class="hero-slide" style="background-image:url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=1400&q=80')"></div>
        </div>

        <div class="hero-overlay"></div>
        <div class="search-panel">
            <h2>Tìm Kiếm</h2>
            <div class="search-row">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Nhập từ khóa tìm kiếm (ví dụ: tên sản phẩm, loại hình du lịch)..."/>
            </div>
            <div class="quick-links">
                <span class="ql">Nổi bật:</span>
                <span class="qtag">Điểm đến phổ biến</span>
                <span class="qtag">Khách sạn nổi bật</span>
                <span class="qtag">Tour du lịch</span>
                <span class="qtag">Trải nghiệm</span>
            </div>
            <div class="login-hint">
                <a href="#">Đăng nhập</a> để nhận thêm ưu đãi tìm kiếm
            </div>
        </div>
        <div class="hero-dots" id="heroDots"></div>
  </section>
 
  <!-- ══════════════════════════════
       MAIN CONTENT
  ══════════════════════════════ -->
  <div class="main-content">
 
    <!-- KHÁCH SẠN NỔI BẬT -->
    <section class="section">
      <div class="section-inner">
        <div class="sec-head">
          <div class="sec-title">
            <i class="fa-solid fa-hotel"></i>
            Khách Sạn Nổi Bật
            <span class="badge">Nổi bật</span>
          </div>
          <a href="./list_hotel.html" class="see-all">Xem tất cả <i class="fa-solid fa-arrow-right fa-xs"></i></a>
        </div>
        <div class="carousel-wrap">
          <button class="car-btn prev" onclick="scrollCar('hotels',-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel" id="hotels">
 
          </div>
          <button class="car-btn next" onclick="scrollCar('hotels',1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </section>
 
    <div class="divider"></div>
 
    <!-- ĐỊA ĐIỂM PHỔ BIẾN -->
    <section class="section">
      <div class="section-inner">
        <div class="sec-head">
          <div class="sec-title">
            <i class="fa-solid fa-location-dot"></i>
            Địa Điểm Phổ Biến
            <span class="badge">Phổ biến</span>
          </div>
          <a href="#" class="see-all">Xem tất cả <i class="fa-solid fa-arrow-right fa-xs"></i></a>
        </div>
        <div class="carousel-wrap">
          <button class="car-btn prev" onclick="scrollCar('dests',-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel" id="dests">
 
          </div>
          <button class="car-btn next" onclick="scrollCar('dests',1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </section>
 
  </div>

    <div id="footer-placeholder"></div>

    <script src="../../js/owner/index.js"></script>
    <script> 
        async function loadComponent(id, file) {
            try {
            const res  = await fetch(file);
            const html = await res.text();
            const parser = new DOMParser();
            const doc    = parser.parseFromString(html, 'text/html');
            document.getElementById(id).innerHTML = doc.body.innerHTML;
            } catch (e) {
            console.warn('Could not load component:', file, e);
            }
        }

        loadComponent('header-placeholder', '../../components/header.html');
        loadComponent('footer-placeholder', '../../components/footer.html');

        
        (function () {
            const track  = document.getElementById('heroTrack');
            const dotsEl = document.getElementById('heroDots');
            const slides = track.querySelectorAll('.hero-slide');
            const total  = slides.length;
            let current  = 0;
            let timer;

            // Tạo dots
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => goTo(i));
                dotsEl.appendChild(dot);
            });

            function goTo(index) {
                dotsEl.querySelectorAll('.hero-dot').forEach(d => d.classList.remove('active'));
                track.style.transform = `translateX(-${index * 100}%)`;
                dotsEl.querySelectorAll('.hero-dot')[index].classList.add('active');
                current = index;
            }

            function next() {
                goTo((current + 1) % total);
            }

            function startTimer() {
                timer = setInterval(next, 5000);
            }

            dotsEl.addEventListener('click', () => {
                clearInterval(timer);
                startTimer();
            });

            startTimer();
            })();
    </script>
</body>
</html>
