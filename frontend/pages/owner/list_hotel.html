<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayNest - Khách Sạn</title>
    <link rel="stylesheet" href="../../css/components/header.css">
    <link rel="stylesheet" href="../../css/components/footer.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/pages/index.css">
    <link rel="stylesheet" href="../../css/pages/list_hotel.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="main-content">
        <section class="section">
            <div class="section-inner">

                <!-- BỘ LỌC -->
                <div class="filter-bar">
                    <div class="filter-group">
                        <label for="filterPrice">Giá:</label>
                        <select id="filterPrice">
                            <option value="all">Tất cả</option>
                            <option value="under1">Dưới 1 triệu</option>
                            <option value="1to3">1 - 3 triệu</option>
                            <option value="3to5">3 - 5 triệu</option>
                            <option value="over5">Trên 5 triệu</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterRating">Đánh giá:</label>
                        <select id="filterRating">
                            <option value="all">Tất cả</option>
                            <option value="5">5 sao</option>
                            <option value="4">4 sao trở lên</option>
                            <option value="3">3 sao trở lên</option>
                        </select>
                    </div>
                </div>

                <!-- DANH SÁCH KHÁCH SẠN -->
                <div class="sec-head">
                    <div class="sec-title">
                        <i class="fa-solid fa-hotel"></i>
                        Tất Cả Các Khách Sạn
                    </div>
                </div>

                <div class="hotel-grid" id="hotelGrid">
                    <!-- render bằng JS -->
                </div>

                <div class="pagination" id="pagination">
                    <!-- render bằng JS -->
                </div>

            </div>
        </section>
    </div>

    <div id="footer-placeholder"></div>

    <!-- <script src="../../js/owner/index.js"></script> -->
    <script>
        async function loadComponent(id, file) {
            try {
                const res  = await fetch(file);
                const html = await res.text();
                const parser = new DOMParser();
                const doc    = parser.parseFromString(html, 'text/html');
                document.getElementById(id).innerHTML = doc.body.innerHTML;
            } catch (e) {
                console.warn('Could not load component:', file, e);
            }
        }
        loadComponent('header-placeholder', '../../components/header.html');
        loadComponent('footer-placeholder', '../../components/footer.html');
    </script>
    <script src="../../js/owner/list_hotel.js"></script>
</body>
</html>
