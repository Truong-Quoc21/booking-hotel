<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayNest - Địa Điểm</title>
    <link rel="stylesheet" href="../../css/components/header.css">
    <link rel="stylesheet" href="../../css/components/footer.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/pages/index.css">
    <link rel="stylesheet" href="../../css/pages/list_destination.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="main-content">
        <section class="section">
            <div class="section-inner">

                <!-- BỘ LỌC -->
                <div class="filter-bar">
                    <div class="filter-group">
                        <label for="filterRegion">Khu vực:</label>
                        <select id="filterRegion">
                            <option value="all">Tất cả</option>
                            <option value="mien-bac">Miền Bắc</option>
                            <option value="mien-trung">Miền Trung</option>
                            <option value="mien-nam">Miền Nam</option>
                        </select>
                    </div>
                </div>

                <!-- DANH SÁCH ĐỊA ĐIỂM -->
                <div class="sec-head">
                    <div class="sec-title">
                        <i class="fa-solid fa-location-dot"></i>
                        Tất Cả Các Địa Điểm Khác
                    </div>
                </div>

                <div class="destination-grid" id="destinationGrid">
                    <!-- render bằng JS -->
                </div>

                <div class="pagination" id="pagination">
                    <!-- render bằng JS -->
                </div>

            </div>
        </section>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        async function loadComponent(id, file) {
            try {
                const res  = await fetch(file);
                const html = await res.text();
                const parser = new DOMParser();
                const doc    = parser.parseFromString(html, 'text/html');
                document.getElementById(id).innerHTML = doc.body.innerHTML;
            } catch (e) {
                console.warn('Could not load component:', file, e);
            }
        }
        loadComponent('header-placeholder', '../../components/header.html');
        loadComponent('footer-placeholder', '../../components/footer.html');
    </script>
    <script src="/frontend/js/owner/list_destination.js"></script>
</body>
</html>
